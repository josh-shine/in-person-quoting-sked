const $=id=>document.getElementById(id),DEFAULT_PEOPLE=['Josh','Joyce','Setter','Online'];let db,rows=[],settings={slot_minutes:20,salespeople:[...DEFAULT_PEOPLE],workday_start:'09:00',workday_end:'16:00'},currentLoc='Victoria',startDate=weekOf(vicToday()),channel,currentUser=null,currentRole='user',currentIsOwner=false;
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function date(s){return new Date(s+'T12:00:00')}function weekOf(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function shift(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function fmt(s,o={month:'short',day:'numeric'}){return date(s).toLocaleDateString(undefined,o)}function escape(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(s,error=false){$('toast').textContent=s;$('toast').classList.remove('hidden');$('toast').classList.toggle('error',error);clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.add('hidden'),3200)}function timeText(min){let h=Math.floor(min/60),m=min%60;return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function minutes(t){if(!t)return null;let[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m}function slotRange(start,end,extra=[]){let out=new Set,step=Number(settings.slot_minutes||20);for(let m=start;m<=end;m+=step)out.add(m);extra.forEach(r=>{let m=minutes(r.appointment_time);if(m!==null&&m>=480&&m<=1140)out.add(m)});return[...out].sort((a,b)=>a-b)}function slots(extra=[]){return slotRange(minutes(settings.workday_start)||540,minutes(settings.workday_end)||960,extra)}function bookingSlots(extra=[]){return slotRange(480,1140,extra)}function isWorkSlot(m){let start=minutes(settings.workday_start)||540,end=minutes(settings.workday_end)||960;return m>=start&&m<=end&&(m-start)%Number(settings.slot_minutes||20)===0}function salespersonClass(n){return({'josh':'sales-josh','joyce':'sales-joyce','setter':'sales-setter','online':'sales-online'}[String(n||'').trim().toLowerCase()]||'')}function spanDays(){return Array.from({length:21},(_,i)=>iso(shift(startDate,i)))}function showModal(html){$('modalRoot').innerHTML=`<div class="modalback" id="backdrop">${html}</div>`;$('b async function init(){if(!C.supabaseUrl||!C.supabasePublishableKey){$('gridwrap').innerHTML='<div class="emptymsg">Shared database connection is missing.</div>';return}db=createClient(C.supabaseUrl,C.supabasePublishableKey);let{data:{session}}=await db.auth.getSession();currentUser=session?.user||null;await refreshRole();updateAuthUI();db.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;currentRole='user';updateAuthUI();setTimeout(async()=>{await refreshRole();updateAuthUI();draw()},0)});$('startDate').value=iso(startDate);await Promise.all([loadRows(),loadSettings()]);draw();channel=db.channel('quote-call-calendar').on('postgres_changes',{event:'*',schema:'public',table:'quote_appointments'},()=>loadRows()).on('postgres_changes',{event:'*',schema:'public',table:'quote_settings'},()=>loadSettings()).subscribe()}
function isOwner(){return currentIsOwner}
async function refreshRole(){currentRole='user';currentIsOwner=false;if(!currentUser)return;let{data:owner,error:ownerError}=await db.rpc('is_quote_app_owner');if(ownerError){console.warn('Could not verify owner access.',ownerError);return}currentIsOwner=owner===true;let{data:role,error}=await db.rpc('get_quote_app_role');if(error){console.warn('Could not load the account role.',error);return}if(role==='admin'||role==='owner')currentRole='admin'}

function openAuthDialog(){showModal(`<div class="modal"><div class="modalhead"><h2>Sign in</h2><button class="btn small" id="close">Close</button></div><form id="authForm"><div class="modalbody"><p>Enter your email and we’ll send you a sign-in link.</p><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div></div><div class="modalfoot"><span></span><button class="btn primary" type="submit">Send sign-in link</button></div></form></div>`);$('close').onclick=closeModal;$('authForm').onsubmit=async e=>{e.preventDefault();let email=$('loginEmail').value.trim().toLowerCase(),{error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin}});if(error){say(error.message,true);return}closeModal();say('Check your email for the sign-in link.') }}
async function openRoleManager(){if(!isOwner())return;let{data,error}=await db.from('app_user_roles').select('email,role').order('email');if(error){say('User access is not set up yet. Apply the access setup in Supabase first.',true);console.error(error);return}let entries=data||[];showModal(`<div class="modal"><div class="modalhead"><h2>User access</h2><button class="btn small" id="close">Done</button></div><div class="modalbody"><p>Admins can view Quote tracking. Users can use the shared schedule without that button.</p><form id="addUserForm"><div class="formgrid"><div class="field"><label for="roleEmail">Email</label><input id="roleEmail" type="email" required placeholder="person@example.com"></div><div class="field"><label for="roleValue">Role</label><select id="roleValue"><option value="user">User</option><option value="admin">Admin</option></select></div></div><button class="btn primary" type="submit">Add or update user</button></form><div class="tablebox" style="margin-top:16px"><table class="summary"><thead><tr><th>Email</th><th>Role</th><th>Update</th></tr></thead><tbody>${entries.map(x=>`<tr><td>${escape(x.email)}</td><td>${isOwner()&&x.email.toLowerCase()===currentUser.email.toLowerCase()?'Owner · Admin':`<select data-role-email="${escape(x.email)}"><option value="user" ${x.role==='user'?'selected':''}>User</option><option value="admin" ${x.role==='admin'?'selected':''}>Admin</option></select>`}</td><td>${isOwner()&&x.email.toLowerCase()===currentUser.email.toLowerCase()?'<span class="pill">Owner</span>':`<button class="btn small" data-save-role="${escape(x.email)}">Save</button>`}</td></tr>`).join('')||'<tr><td colspan="3">No other users have been assigned a role yet.</td></tr>'}</tbody></table></div></div></div>`);$('close').onclick=closeModal;$('addUserForm').onsubmit=async e=>{e.preventDefault();await saveUserRole($('roleEmail').value,$('roleValue').value)};document.querySelectorAll('[data-save-role]').forEach(b=>b.onclick=async()=>{let email=b.dataset async function saveUserRole(email,role){if(!isOwner())return;email=String(email||'').trim().toLowerCase();if(!email||!['admin','user'].includes(role)){say('Enter a valid email and role.',true);return}let{error}=await db.from('app_user_roles').upsert({email,role,updated_at:new Date().toISOString()},{onConflict:'email'});if(error){say(error.message,true);return}say('User role saved.');await openRoleManager()}
async function loadRows(){let{data,error}=await db.from('quote_appointments').select('id,location,appointment_date,appointment_time,client_name,address,notes,salesperson,is_blocked,is_all_day_block,property_count,created_at').order('appointment_date').order('appointment_time');if(error){$('gridwrap').innerHTML='<div class="emptymsg">Could not load the shared schedule. Check the shared database setup.</div>';console.error(error);return}rows=data||[];draw()}

cape(r.client_name)}</span><span class="cellmeta">${escape(r.salesperson||'No salesperson')} · ${Number(r.property_count||1)} propert${Number(r.property_count||1)===1?'y':'ies'}${r.address?' · '+escape(r.address):''}</span></button></td>`}else if(isWorkSlot(m)){html+=`<td class="slotcell"><div class="cell available"><button class="micro" data-book="${d}|${m}">＋ Book</button><button class="micro" data-block="${d}|${m}">Block</button></div></td>`}else html+='<td class="slotcell"></td>'}html+='</tr>'}html+='</tbody></table>';$('gridwrap').innerHTML=html;wireGrid()}

async function toggleDay(d){let existing=rows.find(r=>r.location===currentLoc&&r.appointment_date===d&&r.is_all_day_block);if(existing){await removeRow(existing.id);return}let any=rows.some(r=>r.location===currentLoc&&r.appointment_date===d);if(any){say('Clear the booked or blocked slots first, then block the whole day.',true);return}let{error}=await db.from('quote_appointments').insert({location:currentLoc,appointment_date:d,appointment_time:null,client_name:'',address:'',notes:'',salesperson:'',is_blocked:true,is_all_day_block:true});if(error){say(error.message,true);return}await loadRows();say('Day blocked')}
async function removeRow(id){if(!confirm('Remove this booking or block?'))return;let{error}=await db.from('quote_appointments').delete().eq('id',id);if(error){say(error.message,true);return}await loadRows();say('Removed')}
function editBooking(id,d,m){let r=rows.find(x=>x.id===id)||{location:currentLoc,appointment_date:d||iso(startDate),appointment_time:m==null?'09:00':`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`,client_name:'',address:'',notes:'',salesperson:'',property_count:1};let people=[...new Set([...settings.salespeople,...rows.map(x=>x.salesperson).filter(Boolean),r.salesperson].filter(Boolean))];showModal(`<div class="modal"><div class="modalhead"><h2>${id?'Edit booked lead':'Book a quote call'}</h2><button class="btn small" id="close">Done</button></div><form id="bookingForm"><div class="modalbody"><div class="formgrid"><div class="field"><label for="loc">Location</label><select id="loc"><option ${r.location==='Victoria'?'selected':''}>Victoria</option><option ${r.location==='Prince George'?'selected':''}>Prince George</option></select></div><div class="field"><label for="apptDate">Date</label><input id="apptDate" type="date" required value="${escape(r.appointment_date)}"></div><div class="field"><label for="apptTime">Time</label><select id="apptTime" required>${bookingSlots(id?[r,...rows]:[]).map(x=>{let t=`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;return`<option value="${t}" ${t===(r.appointment_time||'').slice(0,5)?'selected':''}>${timeText(x)}</option>`}).join('')}</select></div><div class="field"><label for="person">Salesperson</label><select id="person"><option value="">Choose a name</option>${people.map(x=>`<option ${x===r.salesperson?'selected':''}>${escape(x)}</option>`).join('')}</select></div><div class="field"><label for="propertyCount">Number of properties</label><select id="propertyCount" required>${Array.from({length:20},(_,i)=>i+1).map(x=>`<option value="${x}" ${Number(r.property_count||1)===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label for="client">Client name</label><input id="client" required value="${escape(r.client_name)}"></div><div class="field full"><label for="address">Address</label><input id="address" value="${escape(r.address)}"></div><div class="field full"><label for="notes">Notes</label><textarea id="notes">${escape(r.notes)}</textarea></div>${r.created_at?`<div class="field full"><p class="tip" style="margin:0"><strong>Booked on:</strong> ${escape(bookedText(r.created_at))}</p></div>`:''}</div></div><div class="modalfoot">${id?'<button type="button" class="btn" id="remove">Remove booking</button>':'<span></span>'}<div class="buttons"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save booking</button></div></div></form></div>`);$('close').onclick=closeModal;$('cancel').onclick=closeModal;if(id)$('remove').onclick=()=>removeRow(id);$('bookingForm').onsubmit=async e=>{e.preventDefault();let x={location:$('loc').value,appointment_date:$('apptDate').value,appointment_time:$('apptTime').value,client_name:$('client').value.trim(),address:$('address').value.trim(),notes:$('notes').value.trim(),salesperson:$('person').value,property_count:Number($('propertyCount').value),is_blocked:false,is_all_day_block:false};let occupied=rows.find(y=>y.id!==id&&!y.is_all_day_block&&y.location===x.location&&y.appointment_date===x.appointment_date&&y.appointment_time?.slice(0,5)===x.appointment_time);if(occupied){say('That timeslot is already booked or blocked.',true);return}let q=id?db.from('quote_appointments').update(x).eq('id',id):db.from('quote_appointments').insert(x),{error}=await q;if(error){say(error.message,true);return}closeModal();await loadRows();say(id?'Booking saved':'Booking added')}}
function openSettings(){showModal(`<div class="modal"><div class="modalhead"><h2>Schedule settings</h2><button class="btn small" id="close">Done</button></div><form id="settingsForm"><div class="modalbody"><div class="field"><label for="interval">Time between slots</label><select id="interval"><option value="20" ${settings.slot_minutes===20?'selected':''}>20 minutes</option><option value="30" ${settings.slot_minutes===30?'selected':''}>30 minutes</option><option value="60" ${settings.slot_minutes===60?'selected':''}>1 hour</option></select></div><div class="formgrid"><div class="field"><label for="workStart">Workday starts</label><select id="workStart">${Array.from({length:12},(_,i)=>480+i*60).map(m=>{let t=String(Math.floor(m/60)).padStart(2,'0')+':00';return`<option value="${t}" ${t===settings.workday_start?'selected':''}>${timeText(m)}</option>`}).join('')}</select></div><div class="field"><label for="workEnd">Workday ends</label><select id="workEnd">${Array.from({length:12},(_,i)=>480+i*60).map(m=>{let t=String(Math.floor(m/60)).padStart(2,'0')+':00';return`<option value="${t}" ${t===settings.workday_end?'selected':''}>${timeText(m)}</option>`}).join('')}</select></div></div><div class="field"><label for="people">Salesperson names</label><textarea id="people">${escape(settings.salespeople.join('\n'))}</textarea></div><p class="tip">Enter one salesperson per line. Changes are shared with the team. The calendar shows your selected work hours. The Add booking form offers times from 8:00 AM through 7:00 PM.</p></div><div class="modalfoot"><span></span><div class="buttons"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save settings</button></div></div></form></div>`);$('close').onclick=closeModal;$('cancel').onclick=closeModal;$('settingsForm').onsubmit=async e=>{e.preventDefault();let names=[...new Set($('people').value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean))];if(!names.length){say('Keep at least one salesperson name.',true);return}let workday_start=$('workStart').value,workday_end=$('workEnd').value;if(minutes(workday_start)>=minutes(workday_end)){say('Workday end must be later than its start.',true);return}let value={id:true,slot_minutes:Number($('interval').value),salespeople:names,workday_start,workday_end,updated_at:new Date().toISOString()};let{error}=await db.from('quote_settings').upsert(value);if(error){say(error.message,true);return}settings={slot_minutes:value.slot_minutes,salespeople:names,workday_start,workday_end};closeModal();draw();say('Settings saved')}}
function openBonus(){let monday=weekOf(startDate),a=iso(shift(monday,-3)),b=iso(shift(monday,3)),counts={};['Josh','Joyce','Setter','Online',...settings.salespeople,...rows.map(r=>r.salesperson).filter(Boolean)].forEach(n=>counts[n]={Victoria:0,'Prince George':0});let counted=rows.filter(r=>{if(r.is_blocked)return false;let d=bookedDay(r.created_at);return d>=a&&d<=b}).sort((x,y)=>String(x.created_at).localeCompare(String(y.created_at)));counted.forEach(r=>{let n=r.salesperson||'';if(!counts[n])counts[n]={Victoria:0,'Prince George':0};if(counts[n][r.location]!==undefined)counts[n][r.location]+=Number(r.property_count)||1});let names=['Josh','Joyce','Setter','Online',...Object.keys(counts).filter(n=>!['Josh','Joyce','Setter','Online'].includes(n)).sort()],qty=n=>counts[n].Victoria+counts[n]['Prince George'],cash=n=>n==='Josh'?qty(n)*4+qty('Online')*3+qty('Setter')*3:n==='Joyce'?qty(n)*4:n==='Setter'||n==='Online'?qty(n)*3:0,total=names.filter(n=>n!=='Online'&&n!=='Setter').reduce((v,n)=>v+cash(n),0);showModal(`<div class="modal"><div class="modalhead"><h2>In-person quotes booked</h2><button class="btn small" id="close">Done</button></div><div class="modalbody"><p style="margin:0 0 13px"><strong>Friday, ${escape(fmt(a,{month:'short',day:'numeric'}))} – Thursday, ${escape(fmt(b,{month:'short',day:'numeric',year:'numeric'}))}</strong></p><div class="tablebox"><table class="summary"><thead><tr><th>Name</th><th>Victoria</th><th>Prince George</th><th>Total</th><th>$ Conversion</th></tr></thead><tbody>${names.map(n=>`<tr><td><strong>${escape(n)}</strong></td><td>${counts[n].Victoria}</td><td>${counts[n]['Prince George']}</td><td>${qty(n)}</td><td><strong>$${cash(n)}</strong></td></tr>`).join('')}<tr class="total"><td colspan="4" style="text-align:right">TOTAL</td><td>$${total}</td></tr></tbody></table></div><p class="tip" style="margin:12px 0 0">Counted by the day each quote was booked (Pacific Time), not the appointment date.</p><details style="margin-top:12px"><summary><strong>Quotes counted (${counted.length})</strong></summary><div class="tablebox"><table class="summary"><thead><tr><th>Booked</th><th>Client</th><th>Location</th><th>Salesperson</th><th>Appointment</th></tr></thead><tbody>${counted.map(r=>`<tr><td>${escape(bookedText(r.created_at))}</td><td>${escape(r.client_name)}</td><td>${escape(r.location)}</td><td>${escape(r.salesperson||"")}</td><td>${r.appointment_time?escape(fmt(r.appointment_date))+" "+escape(timeText(minutes(r.appointment_time))):"Not scheduled yet"}</td></tr>`).join("")}</tbody></table></div></details></div><div class="modalfoot"><span></span><span class="pill">Monday start: ${escape(fmt(iso(monday),{month:'short',day:'numeric',year:'numeric'}))}</span></div></div>`);$('close').onclick=closeModal}
document.querySelectorAll('.loc').forEach(b=>b.onclick=()=>{currentLoc=b.dataset.loc;draw()});$('startDate').onchange=()=>{startDate=weekOf(date($('startDate').value));$('startDate').value=iso(startDate);draw()};$('prevRange').onclick=()=>{startDate=shift(startDate,-21);$('startDate').value=iso(startDate);draw()};$('nextRange').onclick=()=>{startDate=shift(startDate,21);$('startDate').value=iso(startDate);draw()};$('todayBtn').onclick=()=>{startDate=weekOf(vicToday());$('startDate').value=iso(startDate);draw()};$('settingsBtn').onclick=openSettings;$('bonusBtn').onclick=openBonus;$('addBtn').onclick=()=>editBooking(null,iso(startDate),540);init();
$('authBtn').onclick=()=>currentUser?db.auth.signOut():openAuthDialog();$('roleManagerBtn').onclick=openRoleManager;
</script>
